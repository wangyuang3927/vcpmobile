[workspace]
members = [
  "crates/domain",
  "crates/protocol",
  "crates/store",
  "crates/session",
  "crates/bridge-http",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Eric + OpenAI"]
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
once_cell = "1"
futures-util = "0.3"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
pdf-extract = "0.7"
